services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simmer}
      POSTGRES_USER: ${POSTGRES_USER:-simmer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /opt/simmer/shared/.env}
    volumes:
      - simmer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [private]

  web:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ${SIMMER_ENV_FILE:?Set SIMMER_ENV_FILE to the production environment file}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-simmer}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-simmer}
      DJANGO_DEBUG: "False"
      MEDIA_ROOT: /data/media
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60"]
    volumes:
      - simmer_recipe_media:/data/media
      - simmer_staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request as u; req = u.Request(
          'http://127.0.0.1:8000/api/v1/health/',
          headers={'Host': os.environ['SIMMER_DOMAIN'], 'X-Forwarded-Proto': 'https'}
          ); u.urlopen(req, timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SIMMER_DOMAIN: ${SIMMER_DOMAIN:?Set SIMMER_DOMAIN in /opt/simmer/shared/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - simmer_caddy_data:/data
      - simmer_caddy_config:/config
      - simmer_recipe_media:/srv/media:ro
      - simmer_staticfiles:/srv/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [private]

volumes:
  simmer_postgres_data:
    name: simmer_postgres_data
  simmer_recipe_media:
    name: simmer_recipe_media
  simmer_staticfiles:
    name: simmer_staticfiles
  simmer_caddy_data:
    name: simmer_caddy_data
  simmer_caddy_config:
    name: simmer_caddy_config

networks:
  private:
    name: simmer_private
