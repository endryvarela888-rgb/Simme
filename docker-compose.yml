services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: simmer
      POSTGRES_USER: simmer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simmer_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simmer -d simmer"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: ./backend
    environment:
      DATABASE_URL: postgres://simmer:${POSTGRES_PASSWORD:-simmer_local_only}@db:5432/simmer
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-development-key-change-before-deploy}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,10.0.2.2
      THEMEALDB_API_KEY: ${THEMEALDB_API_KEY:-1}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - recipe_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py makemigrations accounts recipes && python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"]
volumes:
  postgres_data:
  recipe_media:
