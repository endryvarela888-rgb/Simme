name: Deploy Simmer API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: simmer-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.SIMMER_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.SIMMER_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SIMMER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/simmer_deploy"
          chmod 600 "$HOME/.ssh/simmer_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Package release
        run: tar --exclude='./.git' --exclude='./.gradle-cache' --exclude='./backend/media' --exclude='./backend/staticfiles' --exclude='./.env' --exclude='./backend/.env' -czf "$RUNNER_TEMP/simmer-release.tar.gz" .
      - name: Copy release and deploy
        env:
          DEPLOY_HOST: ${{ secrets.SIMMER_HOST }}
          DEPLOY_USER: ${{ secrets.SIMMER_USER }}
          RELEASE_ARCHIVE: ${{ runner.temp }}/simmer-release.tar.gz
        run: |
          scp -i "$HOME/.ssh/simmer_deploy" "$RELEASE_ARCHIVE" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/simmer-${GITHUB_SHA}.tar.gz"
          ssh -i "$HOME/.ssh/simmer_deploy" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p /opt/simmer/releases/${GITHUB_SHA} && tar -xzf /tmp/simmer-${GITHUB_SHA}.tar.gz -C /opt/simmer/releases/${GITHUB_SHA} && rm /tmp/simmer-${GITHUB_SHA}.tar.gz && SIMMER_ENV_FILE=/opt/simmer/shared/.env docker compose --env-file /opt/simmer/shared/.env -p simmer -f /opt/simmer/releases/${GITHUB_SHA}/deploy/compose.production.yml up -d --build --remove-orphans"
