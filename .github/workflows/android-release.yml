name: Build Simmer release bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name (for example 1.0.0)
        required: true
        type: string
      version_code:
        description: Increasing Play version code
        required: true
        type: number

permissions:
  contents: read

jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check release credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.SIMMER_GOOGLE_WEB_CLIENT_ID }}
          ADMOB_APP_ID: ${{ secrets.SIMMER_ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.SIMMER_ADMOB_INTERSTITIAL_ID }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD GOOGLE_WEB_CLIENT_ID ADMOB_APP_ID ADMOB_INTERSTITIAL_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          if [[ "$GOOGLE_WEB_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "SIMMER_GOOGLE_WEB_CLIENT_ID does not look like a Google Web Client ID." >&2
            exit 1
          fi
          if [[ ! "${{ inputs.version_code }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "version_code must be a positive integer." >&2
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36 build-tools;36.0.0
      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/simmer-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/simmer-signing/upload-key.jks"
          chmod 600 "$RUNNER_TEMP/simmer-signing/upload-key.jks"
      - name: Build signed Android App Bundle
        working-directory: android
        env:
          SIMMER_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/simmer-signing/upload-key.jks
          SIMMER_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          SIMMER_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          SIMMER_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          SIMMER_GOOGLE_WEB_CLIENT_ID: ${{ secrets.SIMMER_GOOGLE_WEB_CLIENT_ID }}
          ADMOB_APP_ID: ${{ secrets.SIMMER_ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.SIMMER_ADMOB_INTERSTITIAL_ID }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          sed -i 's/\r$//' gradlew && chmod +x gradlew
          ./gradlew --no-daemon bundleRelease \
            -PsimmerGoogleWebClientId="$SIMMER_GOOGLE_WEB_CLIENT_ID" \
            -PsimmerAdmobAppId="$ADMOB_APP_ID" \
            -PsimmerAdmobInterstitialId="$ADMOB_INTERSTITIAL_ID" \
            -PreleaseVersionName="$VERSION_NAME" \
            -PreleaseVersionCode="$VERSION_CODE"
      - name: Upload signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: simmer-release-${{ inputs.version_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
